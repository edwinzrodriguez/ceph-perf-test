fio_repo_url: "https://github.com/axboe/fio.git"
fio_dest_name: "fio"
fio_version: "fio-3.36"
fio_install_prefix: "/usr/local"
samba_repo_url: "https://gitlab.com/samba-team/samba.git"
samba_dest_name: "samba"
samba_version: "samba-4.24.5"
samba_install_prefix: "/usr/local"
