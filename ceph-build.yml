- name: Build Ceph from source
  hosts: mdss clients ganeshas
  become: true
  vars:
    git_base_dir: "{{ ansible_env.HOME }}/git"
    ceph_repo_url: "https://github.com/edwinzrodriguez/ceph.git"
    ceph_dest_name: "ceph-tentacle"
    ceph_version: "ceph-bench-tentacle"
    ceph_install_prefix: "/usr/local"
    ganesha_repo_url: "https://github.com/edwinzrodriguez/nfs-ganesha.git"
    ganesha_dest_name: "nfs-ganesha"
    ganesha_version: "traceflow"
    ganesha_build_dir: "ganesha-build"
    ganesha_install_prefix: "/usr/local"
    fio_repo_url: "https://github.com/axboe/fio.git"
    fio_dest_name: "fio"
    fio_version: "fio-3.36"
    fio_install_prefix: "/usr/local"
  tasks:

    - name: install epel-release RPMs
      yum:
        name:
          - "https://dl.fedoraproject.org/pub/epel/epel-release-latest-{{ ansible_distribution_major_version }}.noarch.rpm"
          - "https://dl.fedoraproject.org/pub/epel/epel-next-release-latest-{{ ansible_distribution_major_version }}.noarch.rpm"
        state: present
        update_cache: yes
      when: ansible_distribution_major_version | int < 10

    - name: install epel-release RPMs (RHEL 10+)
      yum:
        name:
          - "https://dl.fedoraproject.org/pub/epel/epel-release-latest-{{ ansible_distribution_major_version }}.noarch.rpm"
        state: present
        update_cache: yes
      when: ansible_distribution_major_version | int >= 10

    - name: Enable CRB for RHEL/CentOS Stream 9+
      ansible.builtin.command:
        cmd: crb enable
      when: ansible_distribution_major_version | int >= 9
      ignore_errors: yes

    - name: Enable PowerTools for RHEL/CentOS 8
      ansible.builtin.command:
        cmd: dnf config-manager --set-enabled powertools
      when: ansible_distribution_major_version == "8"
      ignore_errors: yes

    # Host images / prior tooling sometimes exclude thrift*, re2*, libarrow*,
    # parquet-libs* from EPEL (e.g. OpenStack coexistence). Those packages are
    # required by install-deps.sh and grpc-devel; clear the filters before deps.
    - name: Clear EPEL package excludes that block Ceph build dependencies
      ansible.builtin.shell: |
        set -e
        shopt -s nullglob
        for f in /etc/yum.repos.d/epel*.repo; do
          # Drop every exclude= line (duplicate keys are common in hand-edited repos)
          sed -i '/^[[:space:]]*exclude[[:space:]]*=/d' "$f"
        done
      args:
        executable: /bin/bash
      ignore_errors: yes

    - name: Install Development Tools group
      ansible.builtin.dnf:
        name: "@Development Tools"
        state: present
        disable_excludes: all

    - name: Create git directory
      ansible.builtin.file:
        path: "{{ git_base_dir }}"
        state: directory
        mode: '0755'
      become: false

    - name: Check if libbacktrace directory exists
      ansible.builtin.stat:
        path: "{{ git_base_dir }}/libbacktrace"
      register: libbacktrace_dir_stat
      become: false

    - name: Clone libbacktrace repository
      ansible.builtin.git:
        repo: "https://github.com/ianlancetaylor/libbacktrace.git"
        dest: "{{ git_base_dir }}/libbacktrace"
      become: false
      when: not libbacktrace_dir_stat.stat.exists

    - name: Configure libbacktrace
      ansible.builtin.command:
        cmd: ./configure --prefix={{ ceph_install_prefix }} --with-pic
        chdir: "{{ git_base_dir }}/libbacktrace"
      become: false
      when: not libbacktrace_dir_stat.stat.exists

    - name: Build libbacktrace
      ansible.builtin.command:
        cmd: make
        chdir: "{{ git_base_dir }}/libbacktrace"
      become: false
      when: not libbacktrace_dir_stat.stat.exists

    - name: Install libbacktrace
      ansible.builtin.command:
        cmd: make install
        chdir: "{{ git_base_dir }}/libbacktrace"
      when: not libbacktrace_dir_stat.stat.exists

    - name: Create ld.so.conf.d entry for Ceph install prefix
      ansible.builtin.copy:
        dest: /etc/ld.so.conf.d/ceph-install-prefix.conf
        content: |
          {{ ceph_install_prefix }}/lib64/ceph
          {{ ceph_install_prefix }}/lib64
          {{ ceph_install_prefix }}/lib
        mode: '0644'

    - name: Run ldconfig for Ceph install prefix
      ansible.builtin.command:
        cmd: ldconfig

    - name: Check if Ceph repository exists
      ansible.builtin.stat:
        path: "{{ git_base_dir }}/{{ ceph_dest_name }}"
      register: ceph_repo_stat
      become: false

    - name: Clone Ceph repository (tentacle branch)
      ansible.builtin.git:
        repo: "{{ ceph_repo_url }}"
        dest: "{{ git_base_dir }}/{{ ceph_dest_name }}"
        version: "{{ ceph_version }}"
#        single_branch: yes
        recursive: yes
      become: false
      when: not ceph_repo_stat.stat.exists

    - name: Create temporary patch file
      ansible.builtin.copy:
        dest: "/tmp/pathfix.patch"
        content: |
          --- ceph.spec.in
          +++ ceph.spec.in
          @@ -523,9 +523,6 @@ BuildRequires:  libcryptopp-devel
           BuildRequires:  libnuma-devel
           %endif
           %endif
          -%if 0%{?rhel} >= 8
          -BuildRequires:  /usr/bin/pathfix.py
          -%endif
           
           %description
           Ceph is a massively scalable, open-source, distributed storage system that runs
        mode: '0644'

    - name: Apply pathfix patch to ceph.spec.in
      ansible.builtin.patch:
        src: "/tmp/pathfix.patch"
        dest: "{{ git_base_dir }}/{{ ceph_dest_name }}/ceph.spec.in"
        remote_src: yes

    - name: Remove temporary patch file
      ansible.builtin.file:
        path: "/tmp/pathfix.patch"
        state: absent

    - name: Ensure python3-setuptools is installed
      ansible.builtin.dnf:
        name: python3-setuptools
        state: present
        disable_excludes: all

    # Re-clear excludes immediately before install-deps: some host images or a
    # previous partial run leave thrift*/re2*/libarrow* filtered out of EPEL.
    - name: Re-clear EPEL excludes before install-deps.sh
      ansible.builtin.shell: |
        set -e
        shopt -s nullglob
        for f in /etc/yum.repos.d/epel*.repo; do
          sed -i '/^[[:space:]]*exclude[[:space:]]*=/d' "$f"
        done
      args:
        executable: /bin/bash
      ignore_errors: yes

    - name: Run install-deps.sh
      ansible.builtin.command:
        cmd: ./install-deps.sh
        chdir: "{{ git_base_dir }}/{{ ceph_dest_name }}"
      environment:
        # Some versions of install-deps.sh might need non-interactive flags or sudo
        SUDO: "sudo"
      ignore_errors: yes

    - name: Install additional development dependencies
      ansible.builtin.dnf:
        name:
          - cmake
          - boost-random
          - nss-devel
          - keyutils-libs-devel
          - libatomic
          - libibverbs-devel
          - librdmacm-devel
          - ninja-build
          - openldap-devel
          - numactl-devel
          - krb5-devel
          - openssl-devel
          - CUnit-devel
          - python3-devel
          - python3-prettytable
          - python3-pyyaml
          - python3-sphinx
          - lz4-devel
          - rdma-core-devel
          - systemd-devel
          - libblkid-devel
          - libaio-devel
          - cryptsetup-devel
          - libnbd-devel
          - libcurl-devel
          - libcap-devel
          - libcap-ng-devel
          - fmt-devel
          - "pkgconfig(libudev)"
          - libnl3-devel
          - liboath-devel
          - libtool
          - libxml2-devel
          - make
          - ncurses-devel
          - libicu-devel
          - patch
          - perl
          - pkgconfig
          - procps
          - python3
          - python3-setuptools
          - python3-Cython
          - snappy-devel
          - sqlite-devel
          - "pkgconfig(udev)"
          - valgrind-devel
          - which
          - xfsprogs-devel
          - xmlstarlet
          - nasm
          - lua-devel
          - lmdb-devel
          - expat-devel
          - gperftools-devel
          - lttng-ust-devel
          - libbabeltrace-devel
          - thrift-devel
          - re2-devel
          - gperf
          - librabbitmq-devel
          - librdkafka-devel
          - protobuf-c
          - protobuf-devel
          - fuse-devel
          - libaio-devel
          - grpc-devel
        state: present
        # Host epel.repo may still filter thrift*/re2* etc.; override for this txn
        disable_excludes: all

    - name: Check if Ceph build directory exists
      ansible.builtin.stat:
        path: "{{ git_base_dir }}/{{ ceph_dest_name }}/build"
      register: ceph_build_stat
      become: false

    - name: Run do_cmake.sh
      ansible.builtin.command:
        cmd: "./do_cmake.sh -DUSE_TRACEFLOW=OFF -DCMAKE_INSTALL_PREFIX={{ ceph_install_prefix }} -DCMAKE_BUILD_TYPE=RelWithDebInfo"
        chdir: "{{ git_base_dir }}/{{ ceph_dest_name }}"
      become: false
      when: not ceph_build_stat.stat.exists

    - name: Build with ninja
      ansible.builtin.command:
        cmd: ninja
        chdir: "{{ git_base_dir }}/{{ ceph_dest_name }}/build"
      become: false
      when: not ceph_build_stat.stat.exists

    - name: Install with ninja
      ansible.builtin.command:
        cmd: ninja install
        chdir: "{{ git_base_dir }}/{{ ceph_dest_name }}/build"
      when: not ceph_build_stat.stat.exists

    - name: Check if fio source directory exists
      ansible.builtin.stat:
        path: "{{ git_base_dir }}/{{ fio_dest_name }}"
      register: fio_dir_stat
      become: false

    - name: Clone fio repository
      ansible.builtin.git:
        repo: "{{ fio_repo_url }}"
        dest: "{{ git_base_dir }}/{{ fio_dest_name }}"
        version: "{{ fio_version }}"
        recursive: yes
      become: false
      when: not fio_dir_stat.stat.exists

    - name: Update fio submodules
      ansible.builtin.command:
        cmd: git submodule update --init --recursive
        chdir: "{{ git_base_dir }}/{{ fio_dest_name }}"
      become: false
      when: not fio_dir_stat.stat.exists

    - name: Configure fio
      ansible.builtin.command:
        cmd:
          - ./configure
          - --prefix={{ fio_install_prefix }}
          - --extra-cflags=-I{{ fio_install_prefix }}/include -L{{ fio_install_prefix }}/lib64
        chdir: "{{ git_base_dir }}/{{ fio_dest_name }}"
      become: false
      when: not fio_dir_stat.stat.exists

    - name: Install fio
      ansible.builtin.command:
        cmd: make install
        chdir: "{{ git_base_dir }}/{{ fio_dest_name }}"
      when: not fio_dir_stat.stat.exists

    - name: Install Ganesha development dependencies
      ansible.builtin.dnf:
        name:
          - libacl-devel
          - libnsl2-devel
          - procps-ng
          - procps-ng-devel
        state: present

    - name: Check if Ganesha source directory exists
      ansible.builtin.stat:
        path: "{{ git_base_dir }}/{{ ganesha_dest_name }}"
      register: ganesha_source_stat
      become: false

    - name: Check if Ganesha build directory exists
      ansible.builtin.stat:
        path: "{{ git_base_dir }}/{{ ganesha_build_dir }}"
      register: ganesha_build_stat
      become: false

    - name: Clone NFS-Ganesha repository (V9.7 branch)
      ansible.builtin.git:
        repo: "{{ ganesha_repo_url }}"
        dest: "{{ git_base_dir }}/{{ ganesha_dest_name }}"
        version: "{{ ganesha_version }}"
#        single_branch: yes
        recursive: yes
      become: false
      when: not ganesha_source_stat.stat.exists

    - name: Update Ganesha submodules
      ansible.builtin.command:
        cmd: git submodule update --init --recursive
        chdir: "{{ git_base_dir }}/{{ ganesha_dest_name }}"
      become: false
      when: not ganesha_source_stat.stat.exists

    - name: Create Ganesha build directory
      ansible.builtin.file:
        path: "{{ git_base_dir }}/{{ ganesha_build_dir }}"
        state: directory
        mode: '0755'
      become: false
      when: not ganesha_build_stat.stat.exists

    - name: Run cmake for NFS-Ganesha
      ansible.builtin.command:
        cmd: "cmake -GNinja -DUSE_TRACEFLOW=OFF -DUSE_FSAL_CEPH=true -DCEPHFS_INCLUDE_DIR={{ ceph_install_prefix }}/include -DCEPHFS_LIBRARY_DIR={{ ceph_install_prefix }}/lib64 -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_INSTALL_PREFIX={{ ganesha_install_prefix }} ../{{ ganesha_dest_name }}/src"
        chdir: "{{ git_base_dir }}/{{ ganesha_build_dir }}"
      become: false
      when: not ganesha_build_stat.stat.exists

    - name: Build Ganesha with ninja
      ansible.builtin.command:
        cmd: ninja
        chdir: "{{ git_base_dir }}/{{ ganesha_build_dir }}"
      become: false
      when: not ganesha_build_stat.stat.exists

    - name: Install Ganesha with ninja
      ansible.builtin.command:
        cmd: ninja install
        chdir: "{{ git_base_dir }}/{{ ganesha_build_dir }}"
      when: not ganesha_build_stat.stat.exists

    - name: Create Ganesha recovery directory
      ansible.builtin.file:
        path: "{{ ganesha_install_prefix }}/var/lib/nfs/ganesha"
        state: directory
        mode: '0755'

    - name: Ensure Ganesha config and log directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ ganesha_install_prefix }}/etc/ganesha"
        - /var/log


    # Minimal config so the unit can start after install. Real EXPORT blocks
    # are written later by the perf framework (GaneshaSystemdManager).
    - name: Create minimal ganesha.conf if missing
      ansible.builtin.copy:
        dest: "{{ ganesha_install_prefix }}/etc/ganesha/ganesha.conf"
        content: |
          NFS_CORE_PARAM {
              Enable_NLM = false;
              Enable_RQUOTA = false;
              Protocols = 4;
          }
          EXPORT_DEFAULTS {
              Access_Type = none;
          }
        mode: '0644'
        force: false

    - name: Create nfs-ganesha systemd service file
      ansible.builtin.copy:
        dest: /etc/systemd/system/nfs-ganesha.service
        content: |
          [Unit]
          Description=NFS-Ganesha-Server
          After=network.target

          [Service]
          Type=forking
          Environment=LD_LIBRARY_PATH={{ ganesha_install_prefix }}/lib64:{{ ganesha_install_prefix }}/lib
          # Use /run (not legacy /var/run) and pass -p so the daemon writes
          # the PID file Type=forking expects after the parent exits.
          PIDFile=/run/ganesha.pid
          ExecStart={{ ganesha_install_prefix }}/bin/ganesha.nfsd -p /run/ganesha.pid -f {{ ganesha_install_prefix }}/etc/ganesha/ganesha.conf -L /var/log/ganesha.log
          ExecReload=/bin/kill -HUP $MAINPID

          [Install]
          WantedBy=multi-user.target
        mode: '0644'

    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: yes

    - name: Disable nfs-ganesha service at boot but verify it starts
      ansible.builtin.systemd:
        name: nfs-ganesha
        enabled: no
        state: started
        daemon_reload: yes
