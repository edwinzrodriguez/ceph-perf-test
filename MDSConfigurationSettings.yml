fs_name: "perf_test_fs"
# CephFSCephadmManager (or legacy CephFSManager) deploys MDS via `ceph orch`.
# CephFSSystemdManager runs a local ceph-mds process on each MDS host.
fs_manager_type: "CephFSCephadmManager"
mount_manager_type: "MountKernelManager"

# Ceph-fuse client settings (used when mount_manager_type is MountFuseManager)
mount_fuse:
  binary_path: "${CEPH_INSTALL_PREFIX}/bin/ceph-fuse"
  client_id: "admin"
  keyring: "/etc/ceph/ceph.client.admin.keyring"
  conf: "/etc/ceph/ceph.conf"
  mount_options: ""
  env_vars: {}

env_vars:
  CEPH_INSTALL_PREFIX: "/usr/local"
  LD_LIBRARY_PATH: "${CEPH_INSTALL_PREFIX}/lib64/ceph:${CEPH_INSTALL_PREFIX}/lib64:${CEPH_INSTALL_PREFIX}/lib:${LD_LIBRARY_PATH}"
  PATH: "${CEPH_INSTALL_PREFIX}/bin:${PATH}"

mount_nfs:
  mount_options: "nfsvers=4.1,proto=tcp,sec=sys"
mount_smb:
  mount_options: "vers=3.0,cache=strict,file_mode=0664,dir_mode=0775,noperm"
num_filesystems: 1
mds_yaml_path: "/cephfs_perf/mds.yaml" # Contains 'service_type: mds' spec (cephadm only)

# Local ceph-mds settings (used when fs_manager_type is CephFSSystemdManager)
mds:
  binary_path: "${CEPH_INSTALL_PREFIX}/bin/ceph-mds"
  ceph_binary_path: "${CEPH_INSTALL_PREFIX}/bin/ceph"
  data_dir: "/var/lib/ceph/mds"
  log_dir: "/var/log/ceph"
  run_dir: "/var/run/ceph"
  conf_path: "/etc/ceph/mds-settings.conf"
  env_vars:
    ENABLE_LOCKSTAT: "true"
  lockstat:
    enabled: true
    path: "${CEPH_INSTALL_PREFIX}/bin/ceph-lockstat"
    threshold: 0
  perf_record: true
  perf_record_script: "/cephfs_perf/perf_record.py"
  perf_record_executable: "ceph-mds"
  perf_record_duration: 5
  logging:
    enabled: false
    debug_mds: 1
    debug_ms: 1
    mds_enable_op_tracker: true
    mds_op_complaint_time: 30

ceph:
  conf: "/etc/ceph/ceph.conf"
  keyring: "/etc/ceph/ceph.client.admin.keyring"
  user_id: "admin"
  fsid: "12345678-1234-1234-1234-123456789012"

ganesha:
  enabled: false
  service_id: "ganesha"
  # type = systemd|cephadm
  type: "systemd"
  binary_path: "${CEPH_INSTALL_PREFIX}/bin/ganesha.nfsd"
  # Optional: extra env_vars merged on top of top-level env_vars
  # env_vars: {}
  ceph_binary_path: "${CEPH_INSTALL_PREFIX}/bin/ceph"
  pid_path: "/var/run/ganesha.pid"
  config_path: "/etc/ganesha/ganesha.conf"
  user_id: "admin"
  keyring_path: "/etc/ceph/ceph.client.admin.keyring"
#  client_log_level: 10
#  finisher_log_level: 10
#  log_level: FULL_DEBUG # DO NOT USE NIV_* here, those only apply on the command line
#  worker_threads: 8
  perf_record: true
  perf_record_script: "/cephfs_perf/perf_record.py"
  perf_record_executable: "ganesha.nfsd"
  perf_record_duration: 5
  # CEPH FSAL options
  # umask: 0
  client_oc: [false, true]
  syncdataonly: [false, true]
  async: [false, true]
#  client_fsync_to_rados: [ true, false ]
  zerocopy: false
  client_oc_size: [ "16GiB" ]
  msgr_workers: [3, 8, 12]
  #rpc_ioq_thrdmin: 4
#  rpc_ioq_thrdmax: [20, 40, 60]
  lockstat:
    enabled: true
    path: "${CEPH_INSTALL_PREFIX}/bin/ceph-lockstat"
    threshold: 0

samba:
  enabled: false
  cluster_id: "samba"
  # type = systemd|cephadm
  type: "cephadm"
  username: "cephuser"
  password: "cephpass"
  workgroup: "WORKGROUP"
  clustering: "never"
  ceph_binary_path: "${CEPH_INSTALL_PREFIX}/bin/ceph"
  user_id: "admin"
  keyring_path: "/etc/ceph/ceph.client.admin.keyring"
  samba_resources_path: "/cephfs_perf/samba/resources.yaml"
  subvolume_group: "smb"
  subvolume_mode: "0777"
  # systemd-only: local ceph mount + smb.conf paths
  mount_base: "/srv/samba"
  config_path: "/etc/samba/smb.conf"
  # systemd-only: use Samba vfs_ceph instead of kernel-mounted share paths
  ceph_vfs: true
  ceph_conf_dir: "/etc/ceph"
#  client_log_level: 1
#  finisher_log_level: 10
  client_oc_size: "16GiB"
  msgr_workers: 8
#  env_vars: {}

# SpecStorage configuration
specstorage:
  output_path: "/cephfs_perf/sfs2020/spec_2020.txt"
  run_command: "/cephfs_perf/sfs2020/run_sfs2020_workload.py"
  workload_dir: "/cephfs_perf/sfs2020/SPECstorage2020"
  results_base_dir: "/cephfs_perf/results"
  mounts_per_fs: 1
  perf_record: true
  perf_record_script: "/cephfs_perf/perf_record.py"
  perf_record_executable: "ceph-mds"
  perf_record_duration: 5
  lockstat:
    enabled: true
    path: "${CEPH_INSTALL_PREFIX}/bin/ceph-lockstat"
    threshold: 0
# Official BENCHMARK values are
#       SWBUILD, VDA, EDA_BLENDED, AI_IMAGE, ENOMICS
  benchmark: "SWBUILD"
  # loadpoints are either a starting value, or a sequence of ints
  loadpoints: [1]
  loadpoints2: [1, 2, 4, 8, 12, 18, 24, 30, 36, 42, 48, 54, 60]
  # When loadpoints is a starting value, num_runs is how many loadpoints
  # are run, and increment is added to starting loadpoint between runs
  increment: 1
  # Only used if increment is specified
  num_runs: 1
  netmist_env: "netmist.env"

# Fio configuration (Uncomment to use FioWorkloadRunner instead of SpecStorageWorkloadRunner)
fio:
  results_base_dir: "/cephfs_perf/results"
  run_command: "/cephfs_perf/fio/run_fio_workload.py"
  executable_path: "${CEPH_INSTALL_PREFIX}/bin/fio"
  # Optional: extra env_vars merged on top of top-level env_vars
  # env_vars: {}
  perf_record_script: "/cephfs_perf/perf_record.py"
  perf_record: false
  perf_record_executable: "ganesha.nfsd"
  perf_record_duration: 30
  flamegraph_path: "/cephfs_perf/FlameGraph"
#  stap_script: "/cephfs_perf/fio/rdtsc-para-callgraph-verbose.stp"
  mounts_per_fs: 1
  gtod_reduce: 1
  ramp_time: 30
  loadpoints:
      duration: 180
      size: "5GiB"
      block-size: ["4MiB", "1MiB", "256KiB"]
      iodepth: [1, 8]
      readwrite: ["randrw", "randread", "randwrite"]
      #rwmixread: [75, 50, 25]
      ioengine: ["libaio"]
      direct: [1, 0]
#      buffered: 0
      create_serialize: 1
      threads: [32, 16, 8, 1]
      extra_args: ""

# CephFS-Tool configuration
cephfs_tool:
  results_base_dir: "/cephfs_perf/results"
  run_command: "/cephfs_perf/cephfs_tool/run_cephfs_workload.py"
  perf_record_script: "/cephfs_perf/perf_record.py"
  perf_record: true
  perf_record_executable: "cephfs-tool"
  perf_record_duration: 30
#  stap_script: "/cephfs_perf/fio/rdtsc-para-callgraph-verbose.stp"
  executable_path: "${CEPH_INSTALL_PREFIX}/bin/cephfs-tool"
  env_vars:
    CEPH_ARGS: "--log-to-stderr=false --log-to-file=false --log-file=/tmp/bench.log"
  config_path: "/etc/ceph/ceph.conf"
  keyring: "/etc/ceph/ceph.client.admin.keyring"
  client_id: "admin"
  root_path: "/"
  duration: 60
  progress: true
  progress_interval: 10
  lockstat:
    enabled: true
    path: "${CEPH_INSTALL_PREFIX}/bin/ceph-lockstat"
    asok: "/var/run/ceph/cephfs-tool.asok"
    threshold: 0
  loadpoints:
    - files: 1024
      size: "5GiB"
      iterations: 3
      extra_args: ""
      threads: [32, 16, 8, 1]
      msgr_workers: [3, 8, 12]
      async: false
      client-oc: [1, 0]
      client-oc-size: ["16GiB", "1GiB", "200MiB"]
      block-size: ["4MiB", "1MiB", "256KiB"]
      fsync-every: [false, true]
    - files: 1024
      size: "5GiB"
      iterations: 3
      extra_args: ""
      threads: [32, 16, 8, 1]
      msgr_workers: [3, 8, 12]
      async: true
      queue-depth: [1, 2, 4]
      client-oc: [1, 0]
      client-oc-size: ["16GiB", "1GiB", "200MiB"]
      block-size: ["4MiB", "1MiB", "256KiB"]
      fsync-every: [false, true]


# Rados bench configuration
rados_bench:
  results_base_dir: "/cephfs_perf/results"
  run_command: "/cephfs_perf/rados_bench/run_rados_workload.py"
  perf_record_script: "/cephfs_perf/perf_record.py"
  perf_record: false
  perf_record_executable: "rados"
  perf_record_duration: 30
  executable_path: "${CEPH_INSTALL_PREFIX}/bin/rados"
  env_vars:
    CEPH_ARGS: "--log-to-stderr=false --log-to-file=false"
  config_path: "/etc/ceph/ceph.conf"
  keyring: "/etc/ceph/ceph.client.admin.keyring"
  client_id: "admin"
  # Pool to run 'rados bench' against. CephPoolManager will create it if it
  # doesn't already exist. Set pool_recreate: true to wipe between iterations.
  pool: "rados_bench_pool"
  # pool_pg_num: 128
  # pool_size: 3
  # pool_min_size: 2
  # pool_recreate: false
  # Keep bench objects after write phase so subsequent seq/rand reads can find them.
  no_cleanup: true
  # Default duration (in seconds) if not overridden per-loadpoint via --run-length.
  duration: 30
  loadpoints:
    - readwrite: ["seqwrite", "randwrite"]
      threads: [32, 16, 8 , 1]
      duration: 30
      min-object-size: "4MiB"
      max-object-size: "4MiB"
#      read-percent: 0
      extra_args: ""
    - readwrite: ["seqread", "randread"]
      threads: [32, 16, 8 , 1]
      duration: 30
      min-object-size: "4MiB"
      max-object-size: "4MiB"
#      read-percent: 100
      extra_args: ""

# RBD (fio --ioengine=rbd) configuration
rbd:
  results_base_dir: "/cephfs_perf/results"
  run_command: "/cephfs_perf/rbd/run_rbd_workload.py"
  perf_record_script: "/cephfs_perf/perf_record.py"
  perf_record: false
  perf_record_executable: "fio"
  perf_record_duration: 30
  flamegraph_path: "/cephfs_perf/FlameGraph"
  executable_path: "${CEPH_INSTALL_PREFIX}/bin/fio"
  rbd_executable_path: "${CEPH_INSTALL_PREFIX}/bin/rbd"
  env_vars:
    CEPH_ARGS: "--log-to-stderr=false --log-to-file=true --log-file=/tmp/bench.log"
  config_path: "/etc/ceph/ceph.conf"
  keyring: "/etc/ceph/ceph.client.admin.keyring"
  client_id: "admin"
  # Pool to hold the RBD images. CephPoolManager creates it and runs
  # 'rbd pool init' when application defaults to 'rbd'.
  pool: "rbd_bench_pool"
  # pool_pg_num: 128
  # pool_size: 3
  # pool_min_size: 2
  # pool_recreate: false
  # RBD image size and per-client image count. One image per client is the
  # common case; set images_per_client > 1 to stripe fio across multiple images.
  image_size: "10GiB"
  images_per_client: 1
  # If true, delete existing images before creating new ones each iteration.
  recreate_images: false
  gtod_reduce: 1
  ramp_time: 5
  threads_fio: true
  loadpoints:
      duration: 60
      size: "5GiB"
      block-size: ["4MiB", "256KiB"]
      iodepth: [8]
      readwrite: ["randwrite", "randread"]
      create_serialize: 1
      direct: [1]
      # Do NOT set create_serialize: 0 for rbd. fio's rbd ioengine races on
      # concurrent connect when numjobs > 1 and setup runs inside each thread
      # instead of sequentially in the main thread. Leave at fio's default (1).
      threads: [32, 8]
      extra_args: ""

