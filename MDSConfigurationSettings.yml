# Retired combined settings file.
# Prefer a workload config:
#   ./cephfs_fio_runner.py configs/workloads/fio.yml [inventory.yml]
#   ./cephfs_sfs2020_runner.py configs/workloads/sfs2020.yml [inventory.yml]
#   ./cephfs_tool_bench_runner.py configs/workloads/cephfs_tool.yml [inventory.yml]
#   ./cephfs_mdsbench_runner.py configs/workloads/mdsbench.yml [inventory.yml]
#   ./cephfs_rados_bench_runner.py configs/workloads/rados_bench.yml [inventory.yml]
#   ./cephfs_rbd_runner.py configs/workloads/rbd.yml [inventory.yml]
#   ./cephfs_elbencho_runner.py configs/workloads/elbencho.yml [inventory.yml]
#
# This shim still composes every workload onto configs/base.yml so
# existing commands that pass MDSConfigurationSettings.yml keep working.
extends: configs/base.yml


# Fio configuration (Uncomment to use FioWorkloadRunner instead of SpecStorageWorkloadRunner)
fio:
  client:
    # Attach perf to the fio process on inventory clients.
    perf_record:
      enabled: true
      script: "/cephfs_perf/perf_record.py"
      executable: fio
      duration: 30
      flamegraph_path: "/cephfs_perf/FlameGraph"
  results_base_dir: "/cephfs_perf/results"
  run_command: "/cephfs_perf/fio/run_fio_workload.py"
  executable_path: "${CEPH_INSTALL_PREFIX}/bin/fio"
  # Optional: extra env_vars merged on top of top-level env_vars
  # env_vars: {}
  mounts_per_fs: 1
  # Remount test directories on each client before every loadpoint and unmount
  # after it completes, to clear client-side caches between runs.
  remount_per_loadpoint: true
  gtod_reduce: 1
  ramp_time: 30
  loadpoints:
      duration: 180
      size: "5GiB"
      block-size: ["4MiB", "1MiB", "256KiB"]
      iodepth: [1, 8]
      readwrite: ["randrw", "randread", "randwrite"]
      #rwmixread: [75, 50, 25]
      ioengine: ["libaio"]
      direct: [1, 0]
#      buffered: 0
      create_serialize: 1
      threads: [32, 16, 8, 1]
      extra_args: ""
  loadpoints:
      - duration: 90
        size: "5GiB"
        block-size: ["4MiB", "256KiB"]
        iodepth: [1, 8]
        readwrite: ["randread"]
        #rwmixread: [75, 50, 25]
        ioengine: ["libaio"]
        direct: [1, 0]
  #      buffered: 0
        create_serialize: 1
        threads: [32, 8, 1]
        extra_args: ""
      - duration: 90
        size: "5GiB"
        block-size: ["4MiB", "256KiB"]
        iodepth: [1, 8]
        readwrite: ["randwrite"]
        #rwmixread: [75, 50, 25]
        ioengine: ["libaio"]
        direct: [1, 0]
  #      buffered: 0
        create_serialize: 1
        threads: [32, 8, 1]
        extra_args: ""


# SpecStorage configuration
specstorage:
  output_path: "/cephfs_perf/sfs2020/spec_2020.txt"
  run_command: "/cephfs_perf/sfs2020/run_sfs2020_workload.py"
  workload_dir: "/cephfs_perf/sfs2020/SPECstorage2020"
  results_base_dir: "/cephfs_perf/results"
  mounts_per_fs: 1
  benchmark: "SWBUILD"
  # loadpoints are either a starting value, or a sequence of ints
  loadpoints: [1]
  loadpoints2: [1, 2, 4, 8, 12, 18, 24, 30, 36, 42, 48, 54, 60]
  # When loadpoints is a starting value, num_runs is how many loadpoints
  # are run, and increment is added to starting loadpoint between runs
  increment: 1
  # Only used if increment is specified
  num_runs: 1
  netmist_env: "netmist.env"


# CephFS-Tool configuration
cephfs_tool:
  client:
    perf_record:
      enabled: true
      script: "/cephfs_perf/perf_record.py"
      executable: cephfs-tool
      duration: 30
    lockstat:
      enabled: true
      path: "${CEPH_INSTALL_PREFIX}/bin/ceph-lockstat"
      asok: "/var/run/ceph/cephfs-tool.asok"
      threshold: 0
  results_base_dir: "/cephfs_perf/results"
  run_command: "/cephfs_perf/cephfs_tool/run_cephfs_workload.py"
  executable_path: "${CEPH_INSTALL_PREFIX}/bin/cephfs-tool"
  env_vars:
    CEPH_ARGS: "--log-to-stderr=false --log-to-file=false --log-file=/tmp/bench.log"
  config_path: "/etc/ceph/ceph.conf"
  keyring: "/etc/ceph/ceph.client.admin.keyring"
  client_id: "admin"
  root_path: "/"
  duration: 60
  progress: true
  progress_interval: 10
  loadpoints:
    - files: 1024
      size: "5GiB"
      iterations: 3
      extra_args: ""
      threads: [32, 16, 8, 1]
      msgr_workers: [3, 8, 12]
      async: false
      client-oc: [1, 0]
      client-oc-size: ["16GiB", "1GiB", "200MiB"]
      block-size: ["4MiB", "1MiB", "256KiB"]
      fsync-every: [false, true]
    - files: 1024
      size: "5GiB"
      iterations: 3
      extra_args: ""
      threads: [32, 16, 8, 1]
      msgr_workers: [3, 8, 12]
      async: true
      queue-depth: [1, 2, 4]
      client-oc: [1, 0]
      client-oc-size: ["16GiB", "1GiB", "200MiB"]
      block-size: ["4MiB", "1MiB", "256KiB"]
      fsync-every: [false, true]



# MDS-Bench configuration (SpecStorage-style SWBUILD metadata via cephfs-mdsbench)
# loadpoints are business-metric integers: for N, launch N processes with
# --clients N --client-id K (barrier) distributed across inventory clients.
mdsbench:
  client:
    perf_record:
      enabled: true
      script: "/cephfs_perf/perf_record.py"
      executable: cephfs-mdsbench
      duration: 30
  results_base_dir: "/cephfs_perf/results"
  run_command: "/cephfs_perf/mdsbench/run_mdsbench_workload.py"
  executable_path: "${CEPH_INSTALL_PREFIX}/bin/cephfs-mdsbench"
  env_vars:
    CEPH_ARGS: "--log-to-stderr=false --log-to-file=false --log-file=/tmp/mdsbench.log"
  config_path: "/etc/ceph/ceph.conf"
  keyring: "/etc/ceph/ceph.client.admin.keyring"
  client_id: "admin"
  root_path: "/"
  workdir: "/mdsbench"
  mode: "balanced"
  # Aggregate ops/s target; split evenly across the N processes at each loadpoint
  ops_per_sec: 12000
  duration: 60
  warmup: 5
  progress: true
  progress_interval: 10
  keep_tree: false
  # SpecStorage-style loadpoints (process / session counts)
  loadpoints2: [1, 2, 4, 8, 12, 18, 24]
  loadpoints: [1, 2, 4]



# Rados bench configuration
rados_bench:
  client:
    # rados bench process on inventory clients. Off unless explicitly enabled.
    perf_record:
      enabled: false
      script: "/cephfs_perf/perf_record.py"
      executable: rados
      duration: 30
  results_base_dir: "/cephfs_perf/results"
  run_command: "/cephfs_perf/rados_bench/run_rados_workload.py"
  executable_path: "${CEPH_INSTALL_PREFIX}/bin/rados"
  env_vars:
    CEPH_ARGS: "--log-to-stderr=false --log-to-file=false"
  config_path: "/etc/ceph/ceph.conf"
  keyring: "/etc/ceph/ceph.client.admin.keyring"
  client_id: "admin"
  # Pool to run 'rados bench' against. CephPoolManager will create it if it
  # doesn't already exist. Set pool_recreate: true to wipe between iterations.
  pool: "rados_bench_pool"
  # pool_pg_num: 128
  # pool_size: 3
  # pool_min_size: 2
  # pool_recreate: false
  # Keep bench objects after write phase so subsequent seq/rand reads can find them.
  no_cleanup: true
  # Default duration (in seconds) if not overridden per-loadpoint via --run-length.
  duration: 30
  loadpoints:
    - readwrite: ["seqwrite", "randwrite"]
      threads: [32, 16, 8 , 1]
      duration: 30
      min-object-size: "4MiB"
      max-object-size: "4MiB"
#      read-percent: 0
      extra_args: ""
    - readwrite: ["seqread", "randread"]
      threads: [32, 16, 8 , 1]
      duration: 30
      min-object-size: "4MiB"
      max-object-size: "4MiB"
#      read-percent: 100
      extra_args: ""


# RBD (fio --ioengine=rbd) configuration
rbd:
  client:
    # fio --ioengine=rbd on inventory clients (not MDS/MON hosts).
    perf_record:
      enabled: true
      script: "/cephfs_perf/perf_record.py"
      executable: fio
      duration: 30
      flamegraph_path: "/cephfs_perf/FlameGraph"
    perf_dump:
      enabled: true
      asok: "/var/run/ceph/fio-rbd.asok"
  results_base_dir: "/cephfs_perf/results"
  run_command: "/cephfs_perf/rbd/run_rbd_workload.py"
  executable_path: "${CEPH_INSTALL_PREFIX}/bin/fio"
  rbd_executable_path: "${CEPH_INSTALL_PREFIX}/bin/rbd"
  env_vars:
    CEPH_ARGS: "--log-to-stderr=false --log-to-file=true --log-file=/tmp/bench.log"
  # Client librados/librbd admin socket. When enabled, the driver appends
  # --admin-socket=<asok> to CEPH_ARGS for fio and dumps `perf dump` once
  # per loadpoint (near end of the RUN window) into results_dir.
  config_path: "/etc/ceph/ceph.conf"
  keyring: "/etc/ceph/ceph.client.admin.keyring"
  client_id: "admin"
  # Pool to hold the RBD images. CephPoolManager creates it and runs
  # 'rbd pool init' when application defaults to 'rbd'.
  pool: "rbd_bench_pool"
  # pool_pg_num: 128
  # pool_size: 3
  # pool_min_size: 2
  # pool_recreate: false
  # RBD image size and per-client image count. One image per client is the
  # common case; set images_per_client > 1 to stripe fio across multiple images.
  image_size: "10GiB"
  images_per_client: 1
  # If true, delete existing images before creating new ones each iteration.
  recreate_images: false
  gtod_reduce: 1
  ramp_time: 5
  threads_fio: true
  loadpoints:
      duration: 60
      size: "5GiB"
      block-size: ["4MiB", "256KiB"]
      iodepth: [8]
      readwrite: ["randwrite", "randread"]
      create_serialize: 1
      direct: [1]
      # Do NOT set create_serialize: 0 for rbd. fio's rbd ioengine races on
      # concurrent connect when numjobs > 1 and setup runs inside each thread
      # instead of sequentially in the main thread. Leave at fio's default (1).
      threads: [32, 8]
      extra_args: ""

#  env_vars: {}

# Elbencho S3 / RGW workload (used by cephfs_elbencho_runner.py)
elbencho:
  results_base_dir: "/cephfs_perf/results"
  run_command: "/cephfs_perf/elbencho/run_elbencho_workload.py"
  executable_path: "/usr/local/bin/elbencho"
  conf_path: "/cephfs_perf/rgw/s3-classic.conf"
  # Dataset caps written into the generated conf (for harness compatibility)
  size_limit: "4T"
  object_limit: 1000000
  load_driver_port: 1611
  distributed: true
  # Open load_driver_port on clients via firewalld/iptables when active
  # (defaults to rgw.manage_firewall when unset)
  manage_firewall: true
  buckets: ["eot-classic"]
  perf_record: false
  perf_record_script: "/cephfs_perf/perf_record.py"
  perf_record_executable: "radosgw"
  perf_record_duration: 30
  env_vars: {}
  loadpoints:
    - readwrite: ["write", "read"]
      threads: [32, 16, 8, 1]
      size: "4MiB"
      block-size: "4MiB"
      files: 1000
      dirs: 1
      extra_args: ""

  # Loadpoints derived from workload-eot.csv + benchmark-s3.sh:
  #   CSV: client_count,object_size,part_size,threads,blockvarpct
  #   Each row expands to PUT/GET/DELETE via readwrite: [write, read, delete]
  #   files (--files/-N) = min(SIZE_LIMIT/obj_size, OBJECT_LIMIT) / (client_count * threads)
  #   with SIZE_LIMIT=4TiB, OBJECT_LIMIT=1e6, client_count=6, threads=32
  #   Use IEC units (KiB/MiB/GiB) to match numfmt --from=iec in the bash script.
  #   blockvarpct applies to write only; s3fastget applies to read only.
  #   Inventory should provide 6 clients to match client_count=6.
  loadpoints1:
    - readwrite: [write, read, delete]
      threads: 32
      size: "8KiB"
      block-size: "8KiB"
      files: 5208
      dirs: 1
      blockvarpct: 4
      s3fastget: true
    - readwrite: [write, read, delete]
      threads: 32
      size: "64KiB"
      block-size: "64KiB"
      files: 5208
      dirs: 1
      blockvarpct: 4
      s3fastget: true
    - readwrite: [write, read, delete]
      threads: 32
      size: "256KiB"
      block-size: "256KiB"
      files: 5208
      dirs: 1
      blockvarpct: 4
      s3fastget: true
    - readwrite: [write, read, delete]
      threads: 32
      size: "512KiB"
      block-size: "512KiB"
      files: 5208
      dirs: 1
      blockvarpct: 4
      s3fastget: true
    - readwrite: [write, read, delete]
      threads: 32
      size: "1MiB"
      block-size: "1MiB"
      files: 5208
      dirs: 1
      blockvarpct: 4
      s3fastget: true
    - readwrite: [write, read, delete]
      threads: 32
      size: "4MiB"
      block-size: "4MiB"
