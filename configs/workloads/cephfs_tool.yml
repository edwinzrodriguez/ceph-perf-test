# cephfs-tool control plane.
extends: ../base.yml


# CephFS-Tool configuration
cephfs_tool:
  client:
    perf_record:
      enabled: true
      script: "/cephfs_perf/perf_record.py"
      executable: cephfs-tool
      duration: 30
    # Uses cephfs-tool --lockstat-dump / --lockstat-threshold (native, per phase).
    lockstat:
      enabled: true
      threshold: 0
  results_base_dir: "/cephfs_perf/results"
  run_command: "/cephfs_perf/cephfs_tool/run_cephfs_workload.py"
  executable_path: "${CEPH_INSTALL_PREFIX}/bin/cephfs-tool"
  env_vars:
    CEPH_ARGS: "--log-to-stderr=false --log-to-file=false --log-file=/tmp/bench.log"
  config_path: "/etc/ceph/ceph.conf"
  keyring: "/etc/ceph/ceph.client.admin.keyring"
  client_id: "admin"
  root_path: "/"
  duration: 180
  progress: true
  progress_interval: 10
  loadpoints:
    - files: 1024
      size: "5GiB"
      iterations: 1
      extra_args: ""
      threads: [32, 8, 1]
      msgr_workers: [8]
      async: false
      client-oc: [1, 0]
      client-oc-size: ["1GiB"]
      block-size: ["256KiB", "4KiB"]
      fsync-every: [false, true]
    - files: 1024
      size: "5GiB"
      iterations: 1
      extra_args: ""
      threads: [32, 8, 1]
      msgr_workers: [8]
      async: true
      queue-depth: [1, 8]
      client-oc: [1, 0]
      client-oc-size: ["1GiB"]
      block-size: ["256KiB", "4KiB"]
      fsync-every: [false, true]
