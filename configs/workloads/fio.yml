# Fio workload (control plane: FioWorkloadRunner).
extends: ../base.yml


# Fio configuration (Uncomment to use FioWorkloadRunner instead of SpecStorageWorkloadRunner)
fio:
  client:
    # Attach perf to the fio process on inventory clients.
    perf_record:
      enabled: true
      script: "/cephfs_perf/perf_record.py"
      executable: fio
      duration: 30
      flamegraph_path: "/cephfs_perf/FlameGraph"
  results_base_dir: "/cephfs_perf/results"
  run_command: "/cephfs_perf/fio/run_fio_workload.py"
  executable_path: "${CEPH_INSTALL_PREFIX}/bin/fio"
  # Optional: extra env_vars merged on top of top-level env_vars
  # env_vars: {}
  mounts_per_fs: 1
  # Remount test directories on each client before every loadpoint and unmount
  # after it completes, to clear client-side caches between runs.
  remount_per_loadpoint: true
  gtod_reduce: 1
  ramp_time: 30
  loadpoints:
      duration: 180
      size: "5GiB"
      block-size: ["4MiB", "1MiB", "256KiB"]
      iodepth: [1, 8]
      readwrite: ["randrw", "randread", "randwrite"]
      #rwmixread: [75, 50, 25]
      ioengine: ["libaio"]
      direct: [1, 0]
#      buffered: 0
      create_serialize: 1
      threads: [32, 16, 8, 1]
      extra_args: ""
  loadpoints:
      - duration: 90
        size: "5GiB"
        block-size: ["4MiB", "256KiB"]
        iodepth: [1, 8]
        readwrite: ["randread"]
        #rwmixread: [75, 50, 25]
        ioengine: ["libaio"]
        direct: [1, 0]
  #      buffered: 0
        create_serialize: 1
        threads: [32, 8, 1]
        extra_args: ""
      - duration: 90
        size: "5GiB"
        block-size: ["4MiB", "256KiB"]
        iodepth: [1, 8]
        readwrite: ["randwrite"]
        #rwmixread: [75, 50, 25]
        ioengine: ["libaio"]
        direct: [1, 0]
  #      buffered: 0
        create_serialize: 1
        threads: [32, 8, 1]
        extra_args: ""
